name: Weekly G7 English Mission Generator

on:
  schedule:
    # 每週日 UTC 12:00 (即台灣時間週日晚上 20:00) 自動觸發
    - cron: '0 12 * * 0'
  workflow_dispatch: # 允許在 GitHub 網頁上手動點按鈕立即觸發

permissions:
  contents: write

jobs:
  generate-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate new weekly lesson via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/generate_weekly_lesson.py

      - name: Commit and push updated lessons.json
        run: |
          git config user.name "NETNAVI Auto-Generator"
          git config user.email "actions@github.com"
          git add lessons.json
          git diff --staged --quiet || git commit -m "feat(mission): auto-generate weekly G7 English lesson"
          git push
